name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 没有 npm install：运行时零依赖，为了让 CI「什么也不证明」而把 Electron 拉进容器，
      # 就是让仓库从此开始怕网络抖动。
      - name: Syntax check every source
        run: npm run check
      # 真正的门禁：每张出货盘都要「唯一解 + 四条铅笔规则推得完 + 两套实现逐格同解」。
      - name: Engine tests
        run: node tools/engine-test.mjs

      # 难度阶梯是承诺不是文案：band 是选取目标，这一招会在某一档不再落进自己的带、
      # 或中位数不再严格递增时变红。
      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "24"

      # 烤出来的战役目录必须跟烤炉给的一样：漂移说明有人手改了 js/data/。
      - name: Baked campaign is reproducible
        run: node tools/bake.mjs --check

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

      # What the five steps above do NOT cover: the page actually booting in a real browser
      # (no uncaught exceptions, the canvas pixels matching what the geometry claims, a dirty
      # save file, a click landing on a control that is there but covered). That is the
      # `browser` job below — until it existed, tools/verify.sh had never been run by CI.

  # 648 browser assertions (five scenarios x two URL shapes), measured 2026-09-28: root 42+37+15
  # +135+95 = 324 with 0 failed, prefix the same 324 with 0 failed, whole run 17.5 s locally.
  # A gate that is only ever run by hand is documentation, not a gate. One invocation covers both
  # shapes because Pages serves us under /z-biz-game-kenken-cos/, and a failed page-relative
  # import used to be invisible: it aborts the scenario mid-way and the shape reports green.
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 22, not the 20 the check job uses: tools/playtest.cjs is a raw CDP driver written
        # against Node's global WebSocket/fetch, which only exist from 22 on. On 20 the first
        # attach dies with "WebSocket is not defined" and the job goes red before a single
        # assertion runs.
        with:
          node-version: 22
      # ubuntu-latest ships google-chrome on PATH, which is what tools/verify.sh looks for
      # (alongside the macOS bundle path). No install step: apt/dpkg on a pinned image is a
      # flake source, and a step that can die of networking reads as "the game is broken".
      # Nothing here measures a real window, so the job needs no xorg / no window manager:
      # playtest.cjs launches Chrome with --window-size=1280,1024 and never touches
      # Emulation.setDeviceMetricsOverride. The narrow case in the ui scenario is done the way
      # the product actually reads width — set canvas.style.width, dispatch `resize`, and let
      # measure() re-run its formula against getBoundingClientRect() (js/render/board.js:20-22).
      # That is also why the geometry numbers can be asserted verbatim on Linux.
      - name: Browser gate (root + prefix)
        env:
          # verify.sh's own watchdog default is 600 s (tools/verify.sh:80); the local both-shape
          # run is 17.5 s, so this is headroom for a shared runner, not a budget the gate is
          # graded against. Raising it cannot turn a red gate green — it only stops the watchdog
          # from killing a run that is merely slow.
          WD_TIMEOUT: 900
        run: bash tools/verify.sh
